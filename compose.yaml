# Infraestructura local del proyecto POS-DE.
# Uso (desde la raíz del repo):  docker compose up -d
# Reiniciar la BD desde cero:    docker compose down -v && docker compose up -d
#                                 cd pos-backend && npm run db:migrate && npm run db:seed
# Volumen creado antes de SPEC-002:  docker exec pos-de-db createdb -U postgres posde_test
name: pos-de

services:
  db:
    image: postgres:16
    container_name: pos-de-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-posde}
    ports:
      # 5434 para no chocar con el Postgres anterior (pos-backend, 5433)
      # Solo localhost: la BD usa credenciales por defecto
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pos-de-pgdata:/var/lib/postgresql/data
      # Solo al crear el volumen: crea posde_test. Esquema y semilla: npm run db:migrate / db:seed (SPEC-002)
      - ./pos-backend/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pos-de-pgdata:
